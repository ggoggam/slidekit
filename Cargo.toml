[workspace]
resolver = "2"
members = [
    "crates/slidekit",
]

# Optimize dependencies even in debug/test builds. The integration suite hashes
# multi-GB cached slides (sha2) and decodes JPEG/deflate/LZW on every run; left
# unoptimized those crates crawl at ~28 MB/s (a 2.7 GB SHA-256 alone took ~97s).
# Optimizing only deps keeps our own crate cheap to compile and debuggable.
[profile.dev.package."*"]
opt-level = 3

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1"
# 1.92 is `hayro-jpeg2000`'s floor (the optional pure-Rust JPEG 2000 backend);
# everything else here builds on 1.85. Kept at the higher figure because
# `rust-version` is static and cannot follow a feature flag — lowering it would
# turn `--features hayro` on an older toolchain into a confusing error.
rust-version = "1.92"

[workspace.dependencies]
thiserror = "2"
sha2 = "0.10"
lru = "0.12"
parking_lot = "0.12"
quick-xml = "0.37"
bytes = "1"
jpeg-decoder = "0.3"
# Every codec here is pure Rust except JPEG 2000, which is the one place where
# that cost correctness rather than convenience. OpenSlide decodes JPEG 2000
# with OpenJPEG, and the pure-Rust alternative does not reproduce it on
# aggressively rate-controlled tiles — which is precisely what Aperio ships.
# `openjpeg-sys` vendors the C sources and builds them with `cc`: a C compiler
# is needed, but no cmake, no pkg-config and no system library. See
# `decode/jp2k/mod.rs` for the measurement, and for why the *transpiled*
# OpenJPEG crate lost to both.
png = "0.18"
jpeg2k = { version = "0.10", default-features = false, features = ["openjpeg-sys"] }
hayro-jpeg2000 = { version = "0.4", default-features = false, features = ["std", "simd"] }
jxl-oxide = { version = "0.12", default-features = false }
weezl = "0.1"
miniz_oxide = "0.8"
ruzstd = "0.7"
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "http"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
url = "2"
