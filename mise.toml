# slidekit is the only Rust project in the monorepo, so its toolchain is pinned
# here rather than at the workspace root — every project's CI job loads the root
# config, and nothing else needs cargo.
[tools]
rust = "latest"
# cargo-nextest: runs tests from every crate's every test binary in one global
# thread pool, so slidekit's I/O-bound integration binaries overlap instead of
# running one binary at a time like `cargo test` does.
"cargo:cargo-nextest" = "latest"

[tasks."pre-commit"]
description = "Run pre-commit checks via prek"
run = "prek run --show-diff-on-failure --color=always --all-files --hook-stage=manual"

# ── Build ─────────────────────────────────────────────────────────────────────

[tasks."build"]
description = "Build all crates (debug)"
run = "cargo build"
sources = ["Cargo.toml", "crates/**/Cargo.toml", "crates/**/*.rs"]

[tasks."build:release"]
description = "Build all crates (release)"
run = "cargo build --release"
sources = ["Cargo.toml", "crates/**/Cargo.toml", "crates/**/*.rs"]

# ── Test ──────────────────────────────────────────────────────────────────────

[tasks.test]
description = """
Run the full test suite. Integration tests download vendor slides from the
OpenSlide test data server (cached under target/testdata); if the manifest's
declared total exceeds the size budget they are skipped via OPENSLIDE_SKIP_DOWNLOAD.
"""
env = { RUST_BACKTRACE = "1" }
run = '''
#!/usr/bin/env bash
set -euo pipefail

manifest="crates/slidekit/tests/testdata.yaml"
limit_gib=10
limit=$((limit_gib * 1024 * 1024 * 1024))

# Sum the declared `size:` fields without fetching anything, so the budget is
# decided before any download. Counts slides by their `- path:` entries.
total=$(awk '/^[[:space:]]*size:/ { s += $2 } END { print s + 0 }' "$manifest")
count=$(grep -cE '^[[:space:]]*-[[:space:]]+path:' "$manifest")
printf 'Test data manifest: %d slides, %d bytes (%.2f GiB).\n' \
  "$count" "$total" "$(awk "BEGIN { print $total / 1073741824 }")"

if [ "$total" -gt "$limit" ]; then
  echo "Declared total exceeds ${limit_gib} GiB -> skipping integration downloads (OPENSLIDE_SKIP_DOWNLOAD=1)."
  export OPENSLIDE_SKIP_DOWNLOAD=1
fi

# nextest runs every test binary's tests in one global pool, so the I/O-bound
# integration binaries overlap instead of running one binary at a time.
# (nextest doesn't run doctests; this crate has none.)
cargo nextest run --workspace
'''

[tasks."test:unit"]
description = "Run unit + network-free tests only (no slide downloads)"
env = { OPENSLIDE_SKIP_DOWNLOAD = "1" }
run = "cargo nextest run --workspace"

# ── Lint & Format ─────────────────────────────────────────────────────────────

[tasks.lint]
description = "Run clippy on all crates"
run = "cargo clippy -- -D warnings"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.check]
description = "Run fmt check, clippy, and tests"
depends = ["fmt:check", "lint", "test"]

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

# ── Bench (OpenSlide comparison) ──────────────────────────────────────────────
# `bench_openslide` cross-checks slidekit against OpenSlide's `slidetool`.
# Homebrew still ships 4.0.0; this builds 4.0.1 from source into .tools/openslide,
# which the [env] block below puts on PATH whenever mise is active in the repo.

[tasks."bench:setup-slidetool"]
description = "Build & install OpenSlide 4.0.1 (slidetool) into .tools/openslide for bench_openslide"
tools = { meson = "latest", ninja = "latest" }
run = '''
#!/usr/bin/env bash
set -euo pipefail

version=4.0.1
sha256=df82f6b264f98d11eeb80d85bbb10c7935fcd69c7abae1d610ce49b9a0437faf
root="${MISE_PROJECT_ROOT:-$(pwd)}"
prefix="$root/.tools/openslide"

if [ -x "$prefix/bin/slidetool" ] && "$prefix/bin/slidetool" --version 2>&1 | grep -q "$version"; then
  echo "slidetool $version already installed at $prefix"
  exit 0
fi

command -v brew >/dev/null || { echo "Homebrew is required to provide the C build deps" >&2; exit 1; }

# OpenSlide's C dependencies. Idempotent: install only what's missing.
# (Accumulate into a string, not a bash array-length expansion — brace-hash
# collides with mise's Tera templating of this run block.)
deps="glib libtiff openjpeg libpng cairo gdk-pixbuf sqlite libxml2 libdicom zstd jpeg-turbo"
missing=""
for d in $deps; do brew list --versions "$d" >/dev/null 2>&1 || missing="$missing $d"; done
[ -z "$missing" ] || brew install $missing

# Keg-only formulae keep their pkg-config files under their own prefix.
pc="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig"
for d in libxml2 libtiff sqlite zstd; do pc="$pc:$(brew --prefix "$d")/lib/pkgconfig"; done
export PKG_CONFIG_PATH="$pc"

work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
url="https://github.com/openslide/openslide/releases/download/v$version/openslide-$version.tar.xz"
echo "Downloading $url"
curl -fsSL -o "$work/os.tar.xz" "$url"
echo "$sha256  $work/os.tar.xz" | shasum -a 256 -c -
tar xf "$work/os.tar.xz" -C "$work"

meson setup "$work/build" "$work/openslide-$version" --prefix="$prefix" -Dbuildtype=release
meson install -C "$work/build"

echo "Installed: $("$prefix/bin/slidetool" --version 2>&1 | head -1) -> $prefix/bin/slidetool"
'''

[tasks."bench:openslide"]
description = "Run the OpenSlide comparison bench (needs slidetool on PATH + warm slide cache)"
run = "cargo test --release --test bench_openslide -- --ignored --nocapture"

# ── Bench (remote storage) ────────────────────────────────────────────────────
# The remote bench reads the same slides from an S3-compatible bucket over byte
# range requests. Credentials come from `.env` (see the [env] block below);
# `bench:upload-slides` mirrors the warm local cache into the bucket first.

[tasks."bench:warm-cache"]
description = "Download + verify every manifest slide into target/testdata (several GB)"
run = "cargo test --release --test test_download -- --ignored --nocapture"

[tasks."bench:upload-slides"]
description = "Mirror the bench slides into the S3-compatible bucket from .env (several GB, skips what's already there)"
run = "cargo test --release --test upload_testdata -- --ignored --nocapture"

[tasks."bench:remote"]
description = "Run the remote-storage bench (needs bench:upload-slides once + warm slide cache)"
run = "cargo test --release --test bench_remote -- --ignored --nocapture"

[env]
# Repo-local slidetool from `mise run bench:setup-slidetool` (harmless if absent).
_.path = [".tools/openslide/bin"]
# Bucket credentials for the remote bench (`bench:remote`), git-ignored.
# Optional: absent .env just means the remote bench skips.
_.file = { path = ".env", redact = true }
