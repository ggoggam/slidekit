name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Runs on main are not: they're what seeds the
# caches every pull request restores from, and a cancelled job saves nothing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Loads mise.ci.toml (test thread limits for the runner).
  MISE_ENV: ci
  # Install and run tasks against the committed mise.lock only.
  MISE_LOCKED: "true"

# GitHub-hosted runners only. This repo is public, so hosted minutes cost nothing.
jobs:
  ci:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [pre-commit, test]
    steps:
      - uses: actions/checkout@v6

      # One source of truth for the mise version: min_version in mise.toml.
      - name: Resolve mise version from mise.toml
        id: mise_version
        run: |
          v=$(sed -n 's/^min_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' mise.toml)
          test -n "$v" || { echo "::error::could not parse min_version from mise.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@v5
        with:
          version: ${{ steps.mise_version.outputs.version }}
          install_args: --locked

      # mise's rust backend only points at rustup, so the toolchain itself (and the
      # rustfmt/clippy components the pre-commit hooks call) is installed here.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}

      - name: Install compiler and lint components
        run: |
          set -euo pipefail
          test -n "$RUSTUP_TOOLCHAIN"
          for attempt in 1 2 3; do
            if rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy; then
              rustc --version
              cargo clippy --version
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Rust download failed; retrying in $((attempt * 5)) seconds."
            sleep "$((attempt * 5))"
          done

      # Cargo.lock is not committed (this is a library), so the manifests key the cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/prek
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.task }}-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('**/Cargo.toml', '.pre-commit-config.yaml') }}
          restore-keys: |
            cargo-${{ matrix.task }}-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      # The integration slides (5.8 GiB, listed in testdata.yaml) come from the OpenSlide
      # test-data server, which throttles each connection to well under 1 MB/s. Fetched by the
      # tests themselves, one connection per slide, a cold run took hours, and a plain
      # actions/cache step only saves once the whole job succeeds, so a cancelled or failing
      # run threw the download away and the next one started cold again.
      #
      # So the slides are restored, topped up and saved as their own steps, before any test
      # runs: aria2c fetches each missing slide over 16 ranged connections and checks its
      # SHA-256, the `.verified` markers spare the tests from re-hashing gigabytes, and the
      # cache is saved straight away. The key follows the manifest, and restore-keys hands
      # back the previous set, so adding a slide downloads only that slide.
      - name: Restore test slides
        if: matrix.task == 'test'
        id: slides
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/openslide-testdata
          key: testdata-${{ hashFiles('crates/slidekit/tests/testdata.yaml') }}
          restore-keys: |
            testdata-

      - name: Download missing test slides
        if: matrix.task == 'test' && steps.slides.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          manifest=crates/slidekit/tests/testdata.yaml
          dest="$HOME/.cache/openslide-testdata"
          base=$(sed -n 's/^base_url:[[:space:]]*//p' "$manifest")
          mkdir -p "$dest"

          # path, sha256 per slide, skipping any already restored and verified.
          awk '/^  - path:/{p=$3} /^    sha256:/{print p, $2}' "$manifest" > "$RUNNER_TEMP/slides"
          : > "$RUNNER_TEMP/aria2.txt"
          while read -r path sha; do
            marker="$dest/${path%.*}.verified"
            if [ -f "$dest/$path" ] && [ "$(cat "$marker" 2>/dev/null)" = "$sha" ]; then
              continue
            fi
            rm -f "$dest/$path" "$marker"
            printf '%s%s\n  out=%s\n  checksum=sha-256=%s\n' "$base" "$path" "$path" "$sha" >> "$RUNNER_TEMP/aria2.txt"
          done < "$RUNNER_TEMP/slides"

          if [ -s "$RUNNER_TEMP/aria2.txt" ]; then
            sudo apt-get install -y -qq aria2 > /dev/null
            aria2c --input-file="$RUNNER_TEMP/aria2.txt" --dir="$dest" \
              --max-concurrent-downloads=4 --split=16 --max-connection-per-server=16 \
              --min-split-size=8M --file-allocation=none --check-integrity=true \
              --max-tries=10 --retry-wait=10 --summary-interval=60 --console-log-level=warn
          fi

          # Markers in the format tests/common/mod.rs writes, newer than each slide.
          while read -r path sha; do
            printf '%s' "$sha" > "$dest/${path%.*}.verified"
          done < "$RUNNER_TEMP/slides"
          du -sh "$dest"

      - name: Save test slides
        if: matrix.task == 'test' && steps.slides.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/openslide-testdata
          key: ${{ steps.slides.outputs.cache-primary-key }}

      # mise.lock pins every tool for every platform, and `--locked` installs fail on a
      # platform with no entry. `mise lock` keeps existing pins, so this only fails on a
      # config change that wasn't relocked, not on a new upstream release.
      - name: Check mise.lock is current
        if: matrix.task == 'pre-commit'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_LOCKED: "false"
        run: |
          set -euo pipefail
          MISE_ENV= mise lock -p linux-x64,linux-x64-musl,linux-arm64,linux-arm64-musl,macos-arm64,macos-x64,windows-x64
          if [ -n "$(git status --porcelain -- 'mise*.lock')" ]; then
            git status --short -- 'mise*.lock'
            git diff -- mise.lock
            echo "::error::mise.lock is stale. Run the \`mise lock -p ...\` command from mise.toml and commit the result."
            exit 1
          fi

      - name: Pre-commit
        if: matrix.task == 'pre-commit'
        run: mise run pre-commit

      - name: Test
        if: matrix.task == 'test'
        run: |
          export OPENSLIDE_TEST_CACHE="$HOME/.cache/openslide-testdata"
          mise run test
