[package]
name = "slidekit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust implementation of OpenSlide for reading whole slide images"

[dependencies]
thiserror.workspace = true
sha2.workspace = true
lru.workspace = true
parking_lot.workspace = true
bytes.workspace = true
jpeg-decoder.workspace = true
png.workspace = true
jpeg2k = { workspace = true, optional = true }
hayro-jpeg2000 = { workspace = true, optional = true }
jxl-oxide.workspace = true
weezl.workspace = true
miniz_oxide.workspace = true
ruzstd.workspace = true
quick-xml.workspace = true
object_store = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[features]
default = ["object-store", "openjpeg"]
# Vendor-agnostic filesystem/blob backend (local, S3, GCS, Azure, HTTP)
# via the Apache Arrow `object_store` crate.
object-store = ["dep:object_store", "dep:tokio", "dep:url"]

# --- JPEG 2000 backend: pick exactly one; `openjpeg` wins if both are on. ---
#
# `openjpeg` decodes bit-identically to OpenSlide, because it *is* the library
# OpenSlide uses. It needs a C compiler (vendored sources, built by `cc`) but no
# system library. `hayro` keeps the build pure Rust for targets that cannot link
# C at all, at a measured cost in accuracy on Aperio slides — see
# `decode/jp2k/mod.rs`. Building with neither is a compile error, not a silent
# fallback.
openjpeg = ["dep:jpeg2k"]
hayro = ["dep:hayro-jpeg2000"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2.workspace = true
ureq = "3"
fs2 = "0.4"
once_cell = "1"
zip = "2"
object_store.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
wiremock = "0.6"
# Implementing `ObjectStore` for the request-counting wrapper in `bench_remote`
# needs the same two crates its trait definition is built from. Both are already
# in the graph via `object_store`, so this adds no compilation.
async-trait = "0.1"
futures-util = "0.3"
