[package]
name = "slidekit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure Rust implementation of OpenSlide for reading whole slide images"

[dependencies]
thiserror.workspace = true
sha2.workspace = true
lru.workspace = true
parking_lot.workspace = true
bytes.workspace = true
jpeg-decoder.workspace = true
weezl.workspace = true
miniz_oxide.workspace = true
quick-xml.workspace = true
object_store = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[features]
default = ["object-store"]
# Vendor-agnostic filesystem/blob backend (local, S3, GCS, Azure, HTTP)
# via the Apache Arrow `object_store` crate.
object-store = ["dep:object_store", "dep:tokio", "dep:url"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2.workspace = true
ureq = "3"
fs2 = "0.4"
once_cell = "1"
zip = "2"
object_store.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
